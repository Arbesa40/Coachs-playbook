[workspace]
resolver = "2"
members = [
    "crates/coach-core",
    "apps/desktop/src-tauri",
    "apps/companion/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Arbesa40/Coachs-playbook"

[workspace.dependencies]
coach-core = { path = "crates/coach-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
# Small, fast binaries for low-end PCs and phones.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
