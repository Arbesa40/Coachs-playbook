name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p coach-core

  build:
    runs-on: windows-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Tauri apps embed the built web UI, so build it before compiling Rust.
      - run: npm run build -w apps/desktop
      - run: npm run build -w apps/companion
      - run: cargo test -p coachs-playbook-desktop
      - run: cargo build -p coachs-playbook-companion
      - name: Bundle FFmpeg for the installer
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*.exe
